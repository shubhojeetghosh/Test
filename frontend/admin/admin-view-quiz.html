<!DOCTYPE html>
<html lang="en">

<head><script src="../api-config.js"></script>
<script src="session-guard.js"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>View Quiz - Admin</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;

            color: #1f2937;

        }


        .page {

            max-width: 1000px;

            margin: 40px auto;

            padding: 0 20px;

        }


        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;

        }


        .back-button {

            border: none;

            background: #e5e7eb;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

        }


        .back-button:hover {

            background: #d1d5db;

        }


        .quiz-card {

            background: white;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;

        }


        .quiz-title {

            margin: 0 0 10px;

            font-size: 28px;

        }


        .quiz-description {

            color: #6b7280;

            margin-bottom: 25px;

            line-height: 1.6;

        }


        .quiz-info {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 20px;

        }


        .info-box {

            background: #f8fafc;

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            padding: 15px;

        }


        .info-label {

            display: block;

            font-size: 12px;

            color: #6b7280;

            margin-bottom: 5px;

        }


        .info-value {

            font-size: 16px;

            font-weight: 600;

        }


        .settings {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 15px;

        }


        .setting {

            background: #eef2ff;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        .questions-title {

            margin: 30px 0 15px;

            font-size: 22px;

        }


        .question-card {

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 22px;

            margin-bottom: 18px;

            background: #fff;

        }


        .question-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .question-number {

            font-weight: 700;

            font-size: 14px;

        }


        .question-section {

            font-size: 12px;

            padding: 5px 10px;

            border-radius: 15px;

            background: #f3f4f6;

        }


        .question-text {

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 18px;

        }


        .options {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

        }


        .option {

            border: 1px solid #e5e7eb;

            border-radius: 8px;

            padding: 12px;

            background: #f9fafb;

        }


        .option.correct {

            border-width: 2px;

            font-weight: 600;

        }


        .correct-label {

            font-size: 12px;

            margin-left: 8px;

        }


        .empty {

            text-align: center;

            padding: 50px;

            background: white;

            border-radius: 12px;

            color: #6b7280;

        }


        @media (max-width: 700px) {

            .quiz-info {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .options {

                grid-template-columns:
                    1fr;

            }


            .quiz-card {

                padding: 20px;

            }

        }

    </style>

  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../theme.css">
</head>


<body>


<div class="page">


    <div class="top-bar">

        <h1>
            Quiz Preview
        </h1>


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Back to Quizzes
        </button>

    </div>


    <div id="quizContainer"></div>


</div>



<script>

/* =========================================================
   GET QUIZ ID
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const quizId =
    params.get("id");



/* =========================================================
   LOAD QUIZ
   ========================================================= */

function loadQuiz() {

    const container =
        document.getElementById(
            "quizContainer"
        );


    if (!quizId) {

        container.innerHTML = `
            <div class="empty">
                Quiz ID was not provided.
            </div>
        `;

        return;
    }


    const quizzes =
        JSON.parse(
            localStorage.getItem(
                "admin_quizzes"
            ) || "[]"
        );


    const quiz =
        quizzes.find(
            function (item) {

                return String(item.id) ===
                       String(quizId);

            }
        );


    if (!quiz) {

        container.innerHTML = `
            <div class="empty">
                Quiz could not be found.
            </div>
        `;

        return;
    }


    renderQuiz(quiz);

}



/* =========================================================
   RENDER QUIZ
   ========================================================= */

function escapeQuizHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderQuiz(quiz) {

    const container =
        document.getElementById(
            "quizContainer"
        );


    const questions =
        Array.isArray(quiz.questions)
            ? quiz.questions
            : [];


    let questionsHTML = "";


    questions.forEach(
        function (question, index) {

            const options =
                question.options || {};


            questionsHTML += `

                <div class="question-card">

                    <div class="question-header">

                        <span class="question-number">
                            Question ${index + 1}
                        </span>

                        <span class="question-section">
                            ${
                                escapeQuizHtml(question.section ||
                                "Reading"
                                )
                            }
                        </span>

                    </div>


                    <div class="question-text">
                        ${
                            escapeQuizHtml(question.question ||
                            "No question text"
                            )
                        }
                    </div>


                    <div class="options">

                        ${renderOption(
                            "A",
                            options.A,
                            question.correct_answer
                        )}

                        ${renderOption(
                            "B",
                            options.B,
                            question.correct_answer
                        )}

                        ${renderOption(
                            "C",
                            options.C,
                            question.correct_answer
                        )}

                        ${renderOption(
                            "D",
                            options.D,
                            question.correct_answer
                        )}

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML = `

        <div class="quiz-card">

            <h2 class="quiz-title">
                ${
                    escapeQuizHtml(quiz.title ||
                    "Untitled Quiz"
                    )
                }
            </h2>


            <div class="quiz-description">
                ${
                    escapeQuizHtml(quiz.description ||
                    "No description provided."
                    )
                }
            </div>


            <div class="quiz-info">

                <div class="info-box">

                    <span class="info-label">
                        Set Number
                    </span>

                    <span class="info-value">
                        ${
                            escapeQuizHtml(quiz.set_number ??
                            "-"
                            )
                        }
                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Duration
                    </span>

                    <span class="info-value">
                        ${
                            escapeQuizHtml(quiz.duration ??
                            "-"
                            )
                        } minutes
                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Total Marks
                    </span>

                    <span class="info-value">
                        ${
                            escapeQuizHtml(quiz.total_marks ??
                            "-"
                            )
                        }
                    </span>

                </div>


                <div class="info-box">

                    <span class="info-label">
                        Pass Marks
                    </span>

                    <span class="info-value">
                        ${
                            escapeQuizHtml(quiz.pass_marks ??
                            "-"
                            )
                        }
                    </span>

                </div>

            </div>


            <div class="settings">

                ${
                    quiz.settings?.show_results
                        ? `<span class="setting">
                            Results Enabled
                           </span>`
                        : ""
                }


                ${
                    quiz.settings?.allow_retake
                        ? `<span class="setting">
                            Retake Allowed
                           </span>`
                        : ""
                }


                ${
                    quiz.settings?.subscription_required
                        ? `<span class="setting">
                            Subscription Required
                           </span>`
                        : ""
                }

            </div>

        </div>


        <h2 class="questions-title">
            Questions (${questions.length})
        </h2>


        ${
            questionsHTML ||
            `
            <div class="empty">
                No questions found.
            </div>
            `
        }

    `;

}



/* =========================================================
   RENDER OPTION
   ========================================================= */

function renderOption(
    letter,
    text,
    correctAnswer
) {

    const isCorrect =
        letter === correctAnswer;


    return `

        <div class="option ${
            isCorrect
                ? "correct"
                : ""
        }">

            <strong>
                ${letter}.
            </strong>

            ${
                escapeQuizHtml(text ||
                "No option"
                )
            }


            ${
                isCorrect
                    ? `<span class="correct-label">
                        ✓ Correct Answer
                       </span>`
                    : ""
            }

        </div>

    `;

}



/* =========================================================
   BACK BUTTON
   ========================================================= */

function goBack() {

    window.location.href =
        "admin.html";

}



/* =========================================================
   START
   ========================================================= */

loadQuiz();

</script>


</body>

</html>
