<!DOCTYPE html>
<html lang="en">

<head><script src="../api-config.js"></script>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EPS TOPIK - Forgot Password</title>

  <link rel="stylesheet" href="style.css">

  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../theme.css">
</head>


<body class="auth-body">


<main class="auth-page">

  <section class="auth-card">


    <a href="../index.html" class="auth-logo">

      <div class="auth-logo-mark">
        K
      </div>

      <div>

        <h1>EPS TOPIK</h1>

        <span>
          EXAM PLATFORM
        </span>

      </div>

    </a>


    <div class="auth-heading">

      <p class="auth-eyebrow">
        PASSWORD RECOVERY
      </p>

      <h2>
        Forgot password?
      </h2>

      <p>
        Enter your registered email address.
        We will send you a 6-digit verification OTP.
      </p>

    </div>


    <div
      id="messageBox"
      class="message-box"
    ></div>


    <form id="forgotPasswordForm">


      <div class="form-group">

        <label for="forgotEmail">
          Registered Email
        </label>

        <input
          type="email"
          id="forgotEmail"
          placeholder="Enter your registered email"
          autocomplete="email"
          required
        >

      </div>


      <button
        type="button"
        id="sendOtpButton"
        class="auth-submit"
       
      >
        Send OTP
      </button>

    </form>


    <p class="auth-switch">

      Remember your password?

      <a href="login.html">
        Log in
      </a>

    </p>


    <a
      href="login.html"
      class="auth-back"
    >
      ← Back to login
    </a>


  </section>

</main>


<script src="js/api.js"></script>
<script src="script.js"></script>

</body>

</html>
