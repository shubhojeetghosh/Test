<!DOCTYPE html>
<html lang="en">

<head><script src="../api-config.js"></script>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EPS TOPIK - Log In</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


<main class="auth-page">

  <section class="auth-card">


    <!-- LOGO -->

    <a href="../index.html" class="auth-logo">

      <div class="auth-logo-mark">
        K
      </div>

      <div>

        <h1>EPS TOPIK</h1>

        <span>
          EXAM PLATFORM
        </span>

      </div>

    </a>


    <!-- HEADING -->

    <div class="auth-heading">

      <p class="auth-eyebrow">
        EPS TOPIK EXAM
      </p>

      <h2>
        Welcome back
      </h2>

      <p>
        Log in to continue your Korean language test preparation.
      </p>

    </div>


    <!-- MESSAGE -->

    <div id="messageBox"
         class="message-box">
    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <div class="label-row">

          <label for="loginPassword">
            Password
          </label>

          <a href="forgot-pass.html">
            Forgot password?
          </a>

        </div>


        <div class="password-box">

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('loginPassword', this)"
          >
            Show
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="auth-submit"
        id="loginButton"
      >
        Log in
      </button>

    </form>


    <div class="auth-divider">
      <span>or</span>
    </div>


    <p class="auth-switch">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </p>


    <a
      href="../index.html"
      class="auth-back"
    >
      ← Back to home
    </a>


  </section>

</main>


<script src="script.js"></script>

</body>

</html>
