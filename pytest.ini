[pytest]
# Discover current model tests and the isolated current-app regression tests.
# The pre-migration test_attempt_api.py and test_quiz_api.py target a removed
# in-memory API; they remain in the repo as history but are not current tests.
testpaths = tests backend/tests
pythonpath = backend
python_files = test_exam.py test_question.py test_quiz.py test_scoring.py test_timer.py test_current_*.py
norecursedirs = _archive .venv
addopts = -p no:cacheprovider
